<p [ngClass]="updateStyles" style="margin-bottom: 10px;">This is an example of ng Class directive</p>
<p [ngClass]="'updateStyles italicText'" style="margin-bottom: 10px;">This is an example of ng Class directive</p>
<p [ngClass]="'updateStyles italicText letterFormat'" style="margin-bottom: 10px;">This is an example of ng Class directive</p>
<p [ngClass]="['updateStyles italicText letterFormat']" style="margin-bottom: 10px;">This is an example of ng Class directive</p>

<input
  type="text"
  placeholder="Enter text here..."
  (input)="textInput($event)"
  [ngClass]="{ txt: hasText }"
/>
